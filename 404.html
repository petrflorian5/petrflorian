<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Petr Florián</title>
  <script>
    // Old and lower-case addresses of the CV page (GitHub Pages paths are case-sensitive).
    (function () {
      var p = location.pathname.replace(/\/+$/, '').toLowerCase();
      if (p === '/cv' || p.indexOf('/cv/') === 0 || p === '/resume1' || p.indexOf('/resume1/') === 0) {
        location.replace('/CV/' + location.hash);
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      display: grid;
      place-items: center;
      padding: 16px;
      background: radial-gradient(ellipse at 50% 45%, #ffffff 0%, #f8f8f6 60%, #f0f0ed 100%) #f8f8f6;
      color: #3b3a37;
      font-family: "Jost", "Helvetica Neue", Arial, sans-serif;
      font-weight: 300;
      text-align: center;
    }
    h1 { font-weight: 400; font-size: 18px; letter-spacing: .3em; text-transform: uppercase; margin-bottom: 12px; }
    p { color: #8a867e; font-size: 14px; letter-spacing: .04em; margin-bottom: 26px; }
    a { color: #3b3a37; font-size: 13px; letter-spacing: .2em; text-transform: uppercase; text-decoration: none; border-bottom: 1px solid #c9c5bd; padding-bottom: 4px; }
    a:hover, a:focus-visible { border-color: #3b3a37; outline: none; }
  </style>
</head>
<body>
  <main>
    <h1>Petr Florián</h1>
    <p>This page doesn’t exist.</p>
    <a href="/">Back to the homepage</a>
  </main>
</body>
</html>
